<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Criar nova senha | Painel da barbearia</title>
    <link rel="stylesheet" href="area-equipe.css">
</head>

<body>
    <main class="login-page">
        <section class="login-card">
            <div class="brand">
                <div class="brand-symbol">B</div>
                <div class="brand-name">PAINEL DA BARBEARIA</div>
            </div>

            <div class="login-header">
                <span class="eyebrow">RECUPERAÇÃO DE ACESSO</span>
                <h1>Criar nova senha</h1>
                <p id="redefinirAjuda">Conferindo o link…</p>
            </div>

            <form id="redefinirForm" class="login-form" novalidate hidden>
                <div class="form-group">
                    <div class="password-label">
                        <label for="novaSenha">Nova senha</label>
                        <button type="button" id="mostrarSenha" class="show-password">Mostrar</button>
                    </div>
                    <div class="password-input">
                        <input type="password" id="novaSenha" autocomplete="new-password" required aria-describedby="regrasSenha">
                    </div>
                    <ul class="regras-senha" id="regrasSenha">
                        <li data-regra="tamanho">Pelo menos 10 caracteres</li>
                        <li data-regra="maiuscula">Uma letra maiúscula</li>
                        <li data-regra="minuscula">Uma letra minúscula</li>
                        <li data-regra="numero">Um número</li>
                    </ul>
                </div>
                <div class="form-group">
                    <label for="confirmarSenha">Confirmar nova senha</label>
                    <input type="password" id="confirmarSenha" autocomplete="new-password" required>
                </div>
                <div id="redefinirMensagem" class="login-message" aria-live="polite"></div>
                <button type="submit" class="login-button" id="salvarNovaSenha">Salvar nova senha</button>
            </form>

            <a href="area-equipe.html" class="back-link" id="voltarLogin">← Voltar para o login</a>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabese.js"></script>
    <script src="redefinir-senha.js"></script>
</body>

</html>
